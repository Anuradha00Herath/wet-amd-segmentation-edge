# =============================================================================
# OCT Lesion Segmentation — Phase 2: ROI Detector Configuration
# =============================================================================
# YOLOv8n trained to detect lesion bounding boxes on full OCT images.
# The detector output feeds Phase 3 (ROI-guided segmentation).
# =============================================================================

project:
  name: "OCT-ROI-Detector"
  phase: 2
  description: "YOLOv8n ROI detector for OCT lesion localisation"
  seed: 42

# ── Source data (raw, from Phase 1) ───────────────────────────────────────────
data:
  image_dir:  "/content/wet-amd-segmentation-edge/data/images"
  mask_dir:   "/content/wet-amd-segmentation-edge/data/masks"

# ── ROI dataset (generated by bbox pipeline) ──────────────────────────────────
roi_dataset:
  root_dir:       "data/roi_dataset"          # YOLO-format dataset root
  dataset_yaml:   "data/roi_dataset/dataset.yaml"
  train_split:    0.70
  val_split:      0.15
  # test = remainder (0.15)
  image_size:     640   # YOLOv8 training resolution (must be multiple of 32)
                        # 640 is strongly recommended for small-object detection

# ── Bbox generation from segmentation masks ───────────────────────────────────
bbox:
  # Class IDs from Phase 1 that count as lesion (background=0 excluded)
  # Retinal Layer(1) is structural — include or exclude as needed
  lesion_class_ids: [2, 3, 4, 5]   # PED, SRF, IRF, RPE
  include_retinal_layer: false      # set true to include class 1 in ROI bbox
  padding_px: 10                    # pixels to expand each side of bbox
  min_area_px: 50                   # ignore components smaller than this (noise)
  merge_all_lesions: true           # true  → one combined bbox per image
                                    # false → one bbox per connected component
  # Strategy for merging: "union" = tightest box around all lesions
  merge_strategy: "union"

# ── RGB class colours (must match Phase 1 config.yaml) ───────────────────────
classes:
  num_seg_classes: 6
  colors_rgb:
    0: [0,   0,   0  ]   # Background
    1: [255, 0,   255]   # Retinal Layer
    2: [255, 255, 0  ]   # PED
    3: [255, 0,   0  ]   # SRF
    4: [0,   0,   255]   # IRF
    5: [0,   255, 0  ]   # RPE
  rgb_tolerance: 40

  # YOLO detection classes (single class: "lesion")
  detector_classes:
    0: "lesion"

# ── YOLOv8n training hyperparameters ─────────────────────────────────────────
training:
  model_size:       "n"             # n=nano (edge-optimised); s/m/l/x for larger
  pretrained:       true            # start from COCO pretrained weights
  epochs:           100
  batch_size:       16
  image_size:       640
  lr0:              0.01            # initial learning rate
  lrf:              0.01            # final lr = lr0 * lrf (cosine schedule)
  momentum:         0.937
  weight_decay:     0.0005
  warmup_epochs:    3
  patience:         20              # early stopping patience (epochs)
  save_period:      10              # save checkpoint every N epochs
  workers:          2               # DataLoader workers (keep low for Colab)
  device:           "auto"          # "auto" | "cpu" | "0" (GPU index)
  amp:              true            # automatic mixed precision
  exist_ok:         true            # overwrite existing experiment dir
  resume:           false           # set to checkpoint path to resume
  project_dir:      "experiments/detector_runs"
  experiment_name:  "yolov8n_oct_roi"

  # Augmentation (ultralytics built-in mosaic/hsv etc.)
  # Disable mosaic for medical images to avoid unnatural compositions
  mosaic:           0.0             # 0.0 = disabled (recommended for OCT)
  mixup:            0.0             # disabled
  copy_paste:       0.0             # disabled
  hsv_h:            0.0             # hue shift — disabled (OCT is greyscale)
  hsv_s:            0.3             # saturation (minimal for greyscale)
  hsv_v:            0.4             # brightness variation
  degrees:          5.0             # rotation (small — OCT orientation matters)
  translate:        0.1
  scale:            0.3
  shear:            0.0
  perspective:      0.0
  flipud:           0.0             # vertical flip (disabled — OCT has fixed orientation)
  fliplr:           0.5             # horizontal flip

# ── Inference / detection ─────────────────────────────────────────────────────
detector:
  checkpoint:       "experiments/detector_runs/yolov8n_oct_roi/weights/best.pt"
  conf_threshold:   0.25            # lower = higher recall (prefer for medical)
  iou_threshold:    0.45            # NMS IoU threshold
  image_size:       640
  device:           "auto"
  padding_px:       15              # extra padding applied at inference time
  max_detections:   10             # max boxes per image
  save_crops:       true            # save cropped ROI patches
  crops_dir:        "results/detector/crops"

# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  metrics_csv:      "results/detector/metrics/detector_metrics.csv"
  visualizations_dir: "results/detector/visualizations"
  num_viz_samples:  16
  iou_thresholds:   [0.5, 0.75]    # for mAP calculation

# ── Profiling ─────────────────────────────────────────────────────────────────
profiling:
  flops_input_shape: [1, 3, 640, 640]
  measure_energy:   true
  energy_backend:   "codecarbon"

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  log_file: "results/detector/run.log"
