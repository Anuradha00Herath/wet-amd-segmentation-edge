# =============================================================================
# OCT Lesion Segmentation — Phase 3: ROI-Guided Pipeline Configuration
# =============================================================================
# Full pipeline: YOLOv8n ROI detection → crop → UNet++ segmentation on ROI
# Padding is applied at inference time — no retraining needed.
# =============================================================================

project:
  name: "OCT-ROI-Pipeline"
  phase: 3
  description: "ROI-guided segmentation: detect ROI → crop → segment"
  seed: 42

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  image_dir:   "/content/wet-amd-segmentation-edge/data/images"
  mask_dir:    "/content/wet-amd-segmentation-edge/data/masks"
  image_size:  256
  in_channels: 1

# ── Classes (must match Phase 1 config) ───────────────────────────────────────
classes:
  num_classes: 6
  names:
    0: "Background"
    1: "Retinal Layer"
    2: "PED"
    3: "SRF"
    4: "IRF"
    5: "RPE"
  colors_rgb:
    0: [0,   0,   0  ]
    1: [255, 0,   255]
    2: [255, 255, 0  ]
    3: [255, 0,   0  ]
    4: [0,   0,   255]
    5: [0,   255, 0  ]
  rgb_tolerance: 40

# ── Detector (Phase 2 YOLOv8n) ────────────────────────────────────────────────
detector:
  checkpoint:      "/content/wet-amd-segmentation-edge/experiments/detector_runs/yolov8n_oct_roi/weights/best.pt"
  conf_threshold:  0.25
  iou_threshold:   0.45
  image_size:      640
  device:          "cuda"
  max_detections:  10

# ── ROI Padding ───────────────────────────────────────────────────────────────
# Asymmetric padding: more horizontal (wide retinal layer), less vertical.
# Applied at inference time — no retraining needed.
roi:
  padding_px:        90          # horizontal padding (left/right)
  padding_py:        40          # vertical padding (top/bottom)
  padding_mode:      "fixed"     # "fixed" | "percent"
  padding_percent:   0.20        # only used if padding_mode = "percent"
  fallback_to_full:  true        # if no detection → run seg on full image
  seg_input_size:    128         # must be divisible by 32
  keep_aspect_ratio: false       # stretch directly — no black padding

# ── Segmentation model (Phase 1 UNet++) ───────────────────────────────────────
segmentation:
  architecture:     "UnetPlusPlus"
  encoder:          "efficientnet-b4"
  encoder_weights:  "imagenet"
  decoder_channels: [256, 128, 64, 32, 16]
  activation:       null
  checkpoint:       "/content/wet-amd-segmentation-edge/models/checkpoints/baseline_unetpp.pth"
  in_channels:      1
  device:           "cuda"

# ── Inference ─────────────────────────────────────────────────────────────────
inference:
  batch_size:         8
  num_warmup_batches: 3
  save_predictions:   true
  output_dir:         "results/pipeline/predictions"
  device:             "cuda"

# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  metrics_csv:          "results/pipeline/metrics/pipeline_metrics.csv"
  comparison_csv:       "results/pipeline/metrics/baseline_vs_roi.csv"
  visualizations_dir:   "results/pipeline/visualizations"
  failure_cases_dir:    "results/pipeline/failure_cases"
  num_viz_samples:      8

# ── Padding sweep experiment ──────────────────────────────────────────────────
padding_sweep:
  enabled:        true
  padding_values: [20, 40, 60, 80, 90, 100]
  output_dir:     "experiments/padding_sweep"

# ── Profiling ─────────────────────────────────────────────────────────────────
profiling:
  measure_energy:    true
  energy_backend:    "codecarbon"
  flops_input_shape: [1, 1, 128, 128]   # matches seg_input_size (ROI, not full image)

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  log_file: "results/pipeline/run.log"